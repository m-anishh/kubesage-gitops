apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # after the operator, before the agent
spec:
  project: default
  source:
    repoURL: https://github.com/m-anishh/kubesage-gitops.git
    targetRevision: main
    path: manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kubesage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true # CRDs may not exist yet on the first sync
    retry:
      limit: 10
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
