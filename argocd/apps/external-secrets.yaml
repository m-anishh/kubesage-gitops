apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # operator and CRDs first
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets # must match the Pod Identity association in Terraform
        resources:
          requests: { cpu: 10m, memory: 64Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
        certController:
          resources:
            requests: { cpu: 10m, memory: 32Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
