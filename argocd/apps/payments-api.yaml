apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/m-anishh/kubesage-gitops.git
    targetRevision: main
    path: charts/demo-app
    helm:
      releaseName: payments-api
      valueFiles:
        - ../../envs/dev/values-payments-api.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
