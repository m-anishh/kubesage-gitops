# No credentials here: the external-secrets pod gets an IAM role from EKS Pod Identity,
# limited to secretsmanager:GetSecretValue on kubesage/github-token.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
