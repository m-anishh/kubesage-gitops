apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubesage-agent
  labels:
    {{- include "kubesage-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "kubesage-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubesage-agent.labels" . | nindent 8 }}
    spec:
      serviceAccountName: kubesage-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: agent
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: AWS_REGION
              value: {{ .Values.config.awsRegion | quote }}
            - name: MODEL_ID
              value: {{ .Values.config.modelId | quote }}
            - name: EMBED_MODEL_ID
              value: {{ .Values.config.embedModelId | quote }}
            - name: ISSUES_REPO
              value: {{ .Values.config.issuesRepo | quote }}
            - name: GITOPS_REPO
              value: {{ .Values.config.gitopsRepo | quote }}
            - name: ALLOWED_NAMESPACES
              value: {{ .Values.config.allowedNamespaces | quote }}
            - name: MAX_TURNS
              value: {{ .Values.config.maxTurns | quote }}
            - name: DRY_RUN
              value: {{ .Values.config.dryRun | quote }}
            - name: QDRANT_URL
              value: "http://kubesage-qdrant:6333"
            - name: GITHUB_TOKEN_FILE
              value: /var/run/secrets/github/token
          volumeMounts:
            - name: github-token
              mountPath: /var/run/secrets/github
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: github-token
          secret:
            secretName: {{ .Values.githubTokenSecret }}
            optional: true # the agent still starts (and logs a warning) before External Secrets syncs it
