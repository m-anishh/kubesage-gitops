# Read-only. No create, update, patch, delete or exec: even if a log line tricks the LLM
# (prompt injection), the agent cannot change the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesage-agent-readonly
  labels:
    {{- include "kubesage-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesage-agent-readonly
  labels:
    {{- include "kubesage-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesage-agent-readonly
subjects:
  - kind: ServiceAccount
    name: kubesage-agent
    namespace: {{ .Release.Namespace }}
