# The name must stay "kubesage-agent": Terraform binds the Bedrock IAM role to
# namespace kubesage / service account kubesage-agent (aws_eks_pod_identity_association).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesage-agent
  labels:
    {{- include "kubesage-agent.labels" . | nindent 4 }}
